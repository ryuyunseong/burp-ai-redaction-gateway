title = "burp-ai-redaction-gateway"

[extend]
useDefault = true

[allowlist]
description = "Project allowlist for local raw inputs, generated outputs, and known synthetic placeholders."
regexTarget = "match"
regexes = [
  '''(?i)DUMMY[_A-Z0-9.-]*''',
  '''(?i)FAKE[_A-Z0-9.-]*''',
  '''(?i)EXAMPLE[_A-Z0-9.-]*''',
  '''(?i)demo[-_A-Za-z0-9.!]*''',
  '''(?i)synthetic[-_A-Za-z0-9.!]*''',
  '''(?i)CorrectHorseBatteryStaple1!''',
  '''(?i)FormPassword123!''',
  '''(?i)HtmlPassword123''',
  '''test_api_key_1234567890abcdef''',
  '''eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*Demo[A-Za-z0-9_-]*''',
  '''dXNlcjpwYXNzd29yZA=='''
]
paths = [
  '''(^|[\\/])local_only[\\/]''',
  '''(^|[\\/])out[\\/]''',
  '''(^|[\\/])raw[\\/]''',
  '''(^|[\\/])raw_vault[\\/]''',
  '''(^|[\\/])exports[\\/]''',
  '''(^|[\\/])reports[\\/]''',
  '''(^|[\\/])extensions[\\/][^\\/]+[\\/]\.gradle[\\/]''',
  '''(^|[\\/])extensions[\\/][^\\/]+[\\/]build[\\/]''',
  '''samples/burp_xml_base64_history\.xml'''
]
