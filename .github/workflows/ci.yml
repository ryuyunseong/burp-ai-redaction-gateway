name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall burp_ai_redaction_gateway scripts/check_ci_results.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Process synthetic sample
        run: python -m burp_ai_redaction_gateway process --input samples/synthetic_burp_history.json --output out/ci_demo --project ci_demo
      - name: Verify sample output
        run: python -m burp_ai_redaction_gateway verify --input out/ci_demo

  collector:
    name: Burp collector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test collector
        run: bash extensions/montoya-collector/gradlew -p extensions/montoya-collector --no-daemon clean build

  required:
    name: PR checks
    if: ${{ always() }}
    needs: [python-tests, collector]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require every check to pass
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/check_ci_results.py
